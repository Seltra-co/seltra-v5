name: Frontend checks

on:
  pull_request:
    paths:
      - "seltra-web/frontend/**"
      - ".github/workflows/frontend-checks.yml"
  push:
    paths:
      - "seltra-web/frontend/**"
      - ".github/workflows/frontend-checks.yml"

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: seltra-web/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: seltra-web/frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint:core-globals
