name: Frontend checks

on:
  pull_request:
    paths:
      - "seltra-web/frontend/**"
      - "seltra-web/core/src/ipc/services/app_runtime_service.ts"
      - "seltra-web/core/src/ipc/services/dev_server_preview.*"
      - "seltra-web/edge/sandbox-gateway/**"
      - ".github/workflows/frontend-checks.yml"
      - ".github/workflows/deploy-sandbox-gateway.yml"
  push:
    paths:
      - "seltra-web/frontend/**"
      - "seltra-web/core/src/ipc/services/app_runtime_service.ts"
      - "seltra-web/core/src/ipc/services/dev_server_preview.*"
      - "seltra-web/edge/sandbox-gateway/**"
      - ".github/workflows/frontend-checks.yml"
      - ".github/workflows/deploy-sandbox-gateway.yml"

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: seltra-web/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: seltra-web/frontend/package-lock.json
      - run: bash ../edge/sandbox-gateway/scripts/npm-ci-retry.sh
      - run: npm run typecheck
      - run: npm run lint:core-globals
