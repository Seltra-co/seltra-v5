name: Deploy Cloudflare sandbox gateway

on:
  push:
    branches:
      - "publish/**"
    paths:
      - "seltra-web/edge/sandbox-gateway/**"
      - "seltra-web/core/src/db/**"
      - "seltra-web/core/src/web/**"
      - "seltra-web/core/src/ipc/handlers/createFromTemplate.ts"
      - "seltra-web/core/src/ipc/handlers/template_handlers.ts"
      - "seltra-web/core/src/ipc/services/app_runtime_service.ts"
      - "seltra-web/core/src/ipc/services/dev_server_preview.ts"
      - "seltra-web/core/src/ipc/services/dev_server_preview.test.ts"
      - "seltra-web/core/scaffold/package.json"
      - "seltra-web/core/scaffold/pnpm-lock.yaml"
      - "seltra-web/core/src/pro/main/ipc/handlers/local_agent/tools/run_build.ts"
      - "seltra-web/core/src/pro/main/ipc/handlers/local_agent/tools/repair_app.ts"
      - "seltra-web/core/server/src/workspace_supervisor.ts"
      - "seltra-web/core/scripts/build-runtime.mjs"
      - "seltra-web/core/worker/**"
      - "seltra-web/core/scripts/audit-runtime-dependencies.mjs"
      - "seltra-web/core/runtime/native/**"
      - "seltra-web/core/package.json"
      - "seltra-web/core/package-lock.json"
      - ".github/workflows/deploy-sandbox-gateway.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: Gateway environment to deploy
        type: choice
        options: [dev, prod]
        default: dev
        required: true

permissions:
  contents: read

jobs:
  deploy-dev:
    if: github.event_name == 'push' || inputs.environment == 'dev' || inputs.environment == 'prod'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SIGNING_SECRET: ${{ secrets.SANDBOX_GATEWAY_SIGNING_SECRET_DEV }}
      WORKER_NAME: seltra-sandbox-gateway-dev
      BUILD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: seltra-web/core/package-lock.json
      - name: Validate deployment secrets
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$SIGNING_SECRET" || { echo "Missing SANDBOX_GATEWAY_SIGNING_SECRET_DEV"; exit 1; }
      - name: Build runtime bundle and stage Linux image context
        shell: bash
        run: |
          cd seltra-web/core
          bash ../edge/sandbox-gateway/scripts/npm-ci-retry.sh
          cd scaffold
          npx --yes pnpm@9.15.9 install --frozen-lockfile
          test -x node_modules/.bin/vite
          cd ..
          node scripts/build-runtime.mjs
          npm prune --omit=dev --no-audit --no-fund
          bash ../edge/sandbox-gateway/scripts/npm-ci-retry.sh --prefix runtime/native --no-audit --no-fund
          npm rebuild --prefix runtime/native --no-audit --no-fund
          cp -a runtime/native/node_modules/. node_modules/
          node ../edge/sandbox-gateway/scripts/prune-runtime-image.mjs node_modules
          node scripts/audit-runtime-dependencies.mjs
          node --test scripts/audit-runtime-dependencies.test.mjs
          node --test ../edge/sandbox-gateway/test/runtime-prune-rules.test.mjs
          image=../edge/sandbox-gateway/image
          mkdir -p "$image/dist/runtime"
          cp package.json package-lock.json "$image/"
          # Dereference local file: package links so the image has self-contained node_modules.
          cp -aL node_modules "$image/node_modules"
          cp -a drizzle "$image/drizzle"
          cp -a worker "$image/worker"
          cp -a scaffold "$image/scaffold"
          mkdir -p "$image/assets/icon"
          cp assets/icon/seltra-mark.png "$image/assets/icon/seltra-mark.png"
          cp dist/runtime/runtime_main.js "$image/dist/runtime/runtime_main.js"
          du -sh "$image"
      - name: Build Linux amd64 image
        working-directory: seltra-web/edge/sandbox-gateway/image
        shell: bash
        run: |
          set -euo pipefail
          docker build --platform linux/amd64 -t seltra-sandbox-runtime:ci .
          docker image ls seltra-sandbox-runtime:ci --format 'image={{.Repository}} size={{.Size}}'
      - name: In-image boot and preview target check
        working-directory: seltra-web/edge/sandbox-gateway/image
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --platform linux/amd64 --entrypoint node seltra-sandbox-runtime:ci -e "console.log(process.platform, process.arch); for (const m of ['better-sqlite3','node-pty','ssh2','@vscode/ripgrep','dugite']) { require(m); console.log('native-module-ok',m) }"
          docker run -d --name seltra-sandbox-runtime-ci --platform linux/amd64 \
            -p 8788:8788 -p 4173:4173 -e RUNTIME_RPC_SECRET=ci-runtime-secret \
            -e RUNTIME_SECRETS_KEY=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA= \
            -e DYAD_WORKSPACE_ID=0123456789abcdef -e DYAD_WEB_RUNTIME_ENTRY=1 \
            seltra-sandbox-runtime:ci
          ready=0
          for attempt in $(seq 1 90); do
            phase=$(curl --fail --silent http://127.0.0.1:8788/__boot-status | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).phase))" 2>/dev/null || true)
            if [ "$phase" = "runtime-failed" ]; then curl --fail --silent http://127.0.0.1:8788/__boot-status; exit 1; fi
            if curl --fail --silent http://127.0.0.1:8788/__ready >/dev/null; then ready=1; break; fi
            if ! docker inspect -f '{{.State.Running}}' seltra-sandbox-runtime-ci | grep -q true; then break; fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then
            docker exec seltra-sandbox-runtime-ci node -e "fetch('http://127.0.0.1:8788/__boot-status').then(r=>r.text()).then(console.log).catch(()=>{})" || true
            docker logs seltra-sandbox-runtime-ci 2>&1 | tail -n 160
            exit 1
          fi
          curl --fail --silent http://127.0.0.1:8788/__boot-status | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const x=JSON.parse(s);if(!x.runtimeHealthy||x.platform!=='linux'||x.arch!=='x64'||!x.glibc||x.envNamesMissing.length||x.files.runtimeBundle!=='present'||x.files.migrationJournal!=='present')process.exit(1);console.log(JSON.stringify({runtimeHealthy:x.runtimeHealthy,node:x.node,platform:x.platform,arch:x.arch,libc:x.glibc,files:x.files,missingEnvNames:x.envNamesMissing.length,logLines:x.logTail.length}))})"
          docker exec seltra-sandbox-runtime-ci node -e "const fs=require('node:fs');if(!fs.existsSync('/opt/dyad/worker/proxy_server.js'))throw Error('preview proxy worker missing');console.log(JSON.stringify({previewProxyWorker:'present'}))"
          docker exec seltra-sandbox-runtime-ci git --version
          docker exec seltra-sandbox-runtime-ci node -e "process.stdout.write('runtime-exec-ok')" | grep -q runtime-exec-ok
          docker exec seltra-sandbox-runtime-ci node -e "const fs=require('node:fs');const p='/opt/dyad/scaffold';if(!fs.statSync(p).isDirectory())throw Error('scaffold directory missing');const entries=fs.readdirSync(p);if(!entries.length)throw Error('scaffold directory is empty');console.log(JSON.stringify({scaffold:'present',entryCount:entries.length}))"
          docker exec seltra-sandbox-runtime-ci node -e "const fs=require('node:fs');const p='/opt/dyad/scaffold/node_modules/.bin/vite';if(!fs.existsSync(p))throw Error('preinstalled scaffold dependencies missing');console.log(JSON.stringify({scaffoldDependencies:'present'}))"
          docker exec seltra-sandbox-runtime-ci node -e "const fs=require('node:fs');const p='/opt/dyad/assets/icon/seltra-mark.png';if(!fs.statSync(p).isFile()||fs.statSync(p).size===0)throw Error('Seltra branding asset missing');console.log(JSON.stringify({brandingAsset:'present',bytes:fs.statSync(p).size}))"
          docker exec -d seltra-sandbox-runtime-ci node -e "require('node:http').createServer((q,s)=>{s.end('preview-smoke-ok')}).listen(4173,'0.0.0.0')"
          for attempt in $(seq 1 20); do curl --fail --silent http://127.0.0.1:4173/ | grep -q preview-smoke-ok && break; sleep 1; done
          curl --fail --silent http://127.0.0.1:4173/ | grep -q preview-smoke-ok
      - name: Stop smoke container
        if: always()
        run: docker rm -f seltra-sandbox-runtime-ci >/dev/null 2>&1 || true
      - name: Validate Worker bundle and Wrangler configuration
        working-directory: seltra-web/edge/sandbox-gateway
        run: npx --yes wrangler@4 deploy --dry-run --config wrangler.jsonc --name "$WORKER_NAME"
      - name: Set container build SHA
        working-directory: seltra-web/edge/sandbox-gateway
        run: |
          node -e 'const fs=require("node:fs");const p="wrangler.jsonc";const c=JSON.parse(fs.readFileSync(p,"utf8"));const image=c.containers?.find(x=>x.class_name==="WorkspaceSandbox")?.images?.base;if(!image)throw new Error("WorkspaceSandbox base image config missing");image.build_vars={...image.build_vars,BUILD_SHA:process.env.BUILD_SHA};fs.writeFileSync(p,JSON.stringify(c,null,2)+"\n")'
      - name: Deploy Worker and container image
        working-directory: seltra-web/edge/sandbox-gateway
        run: npx --yes wrangler@4 deploy --config wrangler.jsonc --name "$WORKER_NAME"
      - name: Set dev gateway signing secret
        working-directory: seltra-web/edge/sandbox-gateway
        shell: bash
        run: printf '%s' "$SIGNING_SECRET" | npx --yes wrangler@4 secret put SANDBOX_GATEWAY_SIGNING_SECRET --config wrangler.jsonc --name "$WORKER_NAME"
      - name: Signed dev workspace, scaffold, runtime RPC body, real create-app, preview, and destroy smoke (prod workflow only)
        if: github.event_name == 'workflow_dispatch' && inputs.environment == 'prod'
        working-directory: seltra-web/edge/sandbox-gateway
        run: node scripts/dev-smoke.mjs

  smoke-dev:
    needs: deploy-dev
    if: needs.deploy-dev.result == 'success' && (github.event_name == 'push' || inputs.environment == 'dev')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SIGNING_SECRET: ${{ secrets.SANDBOX_GATEWAY_SIGNING_SECRET_DEV }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: seltra-web/edge/sandbox-gateway/package-lock.json
      - name: Install smoke dependencies
        run: bash seltra-web/edge/sandbox-gateway/scripts/npm-ci-retry.sh --prefix seltra-web/edge/sandbox-gateway --no-audit --no-fund
      - name: Signed dev workspace, scaffold, runtime RPC body, real create-app, preview, and destroy smoke
        working-directory: seltra-web/edge/sandbox-gateway
        run: node scripts/dev-smoke.mjs

  deploy-prod:
    needs: deploy-dev
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'prod' && github.ref == 'refs/heads/main' && needs.deploy-dev.result == 'success'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SIGNING_SECRET: ${{ secrets.SANDBOX_GATEWAY_SIGNING_SECRET_PROD }}
      WORKER_NAME: seltra-sandbox-gateway-prod
      BUILD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate deployment secrets
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$SIGNING_SECRET" || { echo "Missing SANDBOX_GATEWAY_SIGNING_SECRET_PROD"; exit 1; }
      - name: Build runtime bundle and stage Linux image context
        shell: bash
        run: |
          cd seltra-web/core
          npm ci
          node scripts/build-runtime.mjs
          npm prune --omit=dev --no-audit --no-fund
          node scripts/audit-runtime-dependencies.mjs
          npm ci --prefix runtime/native --no-audit --no-fund
          npm rebuild --prefix runtime/native --no-audit --no-fund
          cp -a runtime/native/node_modules/. node_modules/
          node ../edge/sandbox-gateway/scripts/prune-runtime-image.mjs node_modules
          image=../edge/sandbox-gateway/image
          mkdir -p "$image/dist/runtime"
          cp package.json package-lock.json "$image/"
          cp -a node_modules drizzle "$image/"
          cp -a worker "$image/worker"
          cp -a scaffold "$image/scaffold"
          mkdir -p "$image/assets/icon"
          cp assets/icon/seltra-mark.png "$image/assets/icon/seltra-mark.png"
          cp dist/runtime/runtime_main.js "$image/dist/runtime/runtime_main.js"
      - name: Set container build SHA
        working-directory: seltra-web/edge/sandbox-gateway
        run: |
          node -e 'const fs=require("node:fs");const p="wrangler.jsonc";const c=JSON.parse(fs.readFileSync(p,"utf8"));const image=c.containers?.find(x=>x.class_name==="WorkspaceSandbox")?.images?.base;if(!image)throw new Error("WorkspaceSandbox base image config missing");image.build_vars={...image.build_vars,BUILD_SHA:process.env.BUILD_SHA};fs.writeFileSync(p,JSON.stringify(c,null,2)+"\n")'
      - name: Deploy Worker and container image
        working-directory: seltra-web/edge/sandbox-gateway
        run: npx --yes wrangler@4 deploy --config wrangler.jsonc --name "$WORKER_NAME"
      - name: Set production gateway signing secret
        working-directory: seltra-web/edge/sandbox-gateway
        shell: bash
        run: printf '%s' "$SIGNING_SECRET" | npx --yes wrangler@4 secret put SANDBOX_GATEWAY_SIGNING_SECRET --config wrangler.jsonc --name "$WORKER_NAME"
