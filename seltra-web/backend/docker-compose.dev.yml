services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: seltra_local
      POSTGRES_USER: seltra
      POSTGRES_PASSWORD: seltra_local_only
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seltra -d seltra_local"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - seltra-postgres-dev:/var/lib/postgresql/data

volumes:
  seltra-postgres-dev:
